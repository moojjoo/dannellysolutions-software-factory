name: validate-factory
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
      - name: Validate reusable templates
        run: python3 scripts/validate_templates.py
      - name: Test repository integration contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py'
